<svg width="1100" height="210" viewBox="0 0 1100 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated experience timeline</title>
  <desc id="desc">A dark teal animated timeline: AI intern at RExharge in 2025, AI and automation trainee at KVC Industrial Supplies (Sonepar Malaysia) in 2026, then founder of Kaivera from July 2026 to the present.</desc>
  <style>
    .title { font: 800 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #F0FDFA; letter-spacing: .08em; }
    .subtitle { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #99F6E4; }
    .company { font: 800 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #FFFFFF; }
    .role { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #99F6E4; }
    .date { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #7DD3FC; letter-spacing: .08em; }
    .now { font: 800 9px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #0B1220; letter-spacing: .14em; }
    .card { fill: #0F1B2D; stroke: #134E4A; stroke-width: 1; filter: url(#glow); }
    .card-now { stroke: #14B8A6; }
    .rail { stroke: #1E293B; stroke-width: 3; }
    .flow { stroke: url(#grad); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 120 620; animation: run 4.8s linear infinite; filter: url(#lineGlow); }
    .dot { fill: #14B8A6; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .d2 { animation-delay: .55s; }
    .d3 { animation-delay: 1.1s; }
    .ping { stroke: #2DD4BF; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; }
    .sweep { animation: sweep 6.2s ease-in-out infinite; }
    @keyframes run { to { stroke-dashoffset: -740; } }
    @keyframes pulse {
      0%, 100% { opacity: .75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.35); }
    }
    @keyframes ping {
      0% { opacity: .9; transform: scale(1); }
      100% { opacity: 0; transform: scale(2.6); }
    }
    @keyframes sweep {
      0%, 100% { transform: translateX(-160px); opacity: 0; }
      20%, 75% { opacity: .5; }
      55% { transform: translateX(980px); opacity: .2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .dot, .ping, .sweep { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset=".55" stop-color="#0B1F26"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="grad" x1="100" y1="108" x2="1000" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".45" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#99F6E4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#0D9488" flood-opacity=".25"/>
    </filter>
    <filter id="lineGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="1100" height="210">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#14B8A6" flood-opacity=".8"/>
    </filter>
  </defs>

  <rect width="1100" height="210" rx="18" fill="url(#bg)"/>
  <g opacity=".16"><rect class="sweep" x="0" y="0" width="160" height="210" fill="url(#grad)"/></g>

  <text x="48" y="44" class="title">EXPERIENCE TRAJECTORY</text>
  <text x="48" y="66" class="subtitle">Predictive ML → enterprise automation → founding an AI operations partner</text>

  <path class="rail" d="M100 108 H1000"/>
  <path class="flow" d="M100 108 H1000"/>

  <text x="190" y="94" class="date" text-anchor="middle">MAY 2025 – JUL 2025</text>
  <text x="550" y="94" class="date" text-anchor="middle">MAY 2026 – JUL 2026</text>
  <text x="910" y="94" class="date" text-anchor="middle">JUL 2026 – PRESENT</text>

  <circle class="dot" cx="190" cy="108" r="7"/>
  <circle class="dot d2" cx="550" cy="108" r="7"/>
  <circle class="ping" cx="910" cy="108" r="7"/>
  <circle class="dot d3" cx="910" cy="108" r="7" style="fill:#2DD4BF"/>

  <rect class="card" x="40" y="124" width="300" height="64" rx="12"/>
  <text x="190" y="150" class="company" text-anchor="middle">RExharge</text>
  <text x="190" y="172" class="role" text-anchor="middle">AI Intern · EV site-selection ML</text>

  <rect class="card" x="400" y="124" width="300" height="64" rx="12"/>
  <text x="550" y="150" class="company" text-anchor="middle">KVC Industrial Supplies</text>
  <text x="550" y="172" class="role" text-anchor="middle">AI &amp; Automation · Sonepar Malaysia</text>

  <rect class="card card-now" x="760" y="124" width="300" height="64" rx="12"/>
  <rect x="1012" y="132" width="38" height="15" rx="7.5" fill="#2DD4BF"/>
  <text x="1031" y="143" class="now" text-anchor="middle">NOW</text>
  <text x="910" y="150" class="company" text-anchor="middle">Kaivera</text>
  <text x="910" y="172" class="role" text-anchor="middle">Founder · AI operations partner</text>
</svg>
