<svg width="1100" height="250" viewBox="0 0 1100 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated current focus radar</title>
  <desc id="desc">A dark teal radar sweep with six focus areas: agent reliability, human-in-the-loop systems, generative and agentic AI, process automation, Kaivera, and honest forecasting.</desc>
  <style>
    .title { font: 800 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #F0FDFA; letter-spacing: .08em; }
    .subtitle { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #99F6E4; }
    .axis { stroke: #134E4A; stroke-width: 1.1; opacity: .8; }
    .ring { stroke: #134E4A; stroke-width: 1; fill: none; }
    .sweep { transform-box: view-box; transform-origin: 190px 128px; animation: rotate 6s linear infinite; }
    .blip { fill: #2DD4BF; transform-box: fill-box; transform-origin: center; animation: ping 3s ease-in-out infinite; }
    .p1 { animation-delay: .5s; }
    .p2 { animation-delay: 1s; }
    .p3 { animation-delay: 1.5s; }
    .p4 { animation-delay: 2s; }
    .p5 { animation-delay: 2.5s; }
    .bnum { font: 700 9px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #5EEAD4; }
    .tag { fill: #0F1B2D; stroke: #134E4A; stroke-width: 1; filter: url(#glow); }
    .tagText { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #FFFFFF; }
    .sub { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #99F6E4; }
    .idx { font: 700 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #2DD4BF; letter-spacing: .1em; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes ping {
      0%, 100% { opacity: .55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.6); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .blip { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset=".5" stop-color="#0B1F26"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="scope" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(190 128) scale(96)">
      <stop stop-color="#0D9488" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="190" y1="40" x2="262" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity=".55"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#0D9488" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1100" height="250" rx="18" fill="url(#bg)"/>

  <circle cx="190" cy="128" r="96" fill="url(#scope)"/>
  <circle class="ring" cx="190" cy="128" r="32"/>
  <circle class="ring" cx="190" cy="128" r="64"/>
  <circle class="ring" cx="190" cy="128" r="96" style="stroke:#0D9488"/>
  <path class="axis" d="M190 32 V224 M106.9 80 L273.1 176 M106.9 176 L273.1 80"/>

  <g class="sweep">
    <path d="M190 128 L190 32 A96 96 0 0 1 263.5 66.3 Z" fill="url(#sweepGrad)"/>
    <path d="M190 128 L263.5 66.3" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="190" cy="128" r="3.5" fill="#99F6E4"/>

  <circle class="blip" cx="213.9" cy="62.2" r="4"/>
  <circle class="blip p1" cx="234.8" cy="124.1" r="4"/>
  <circle class="blip p2" cx="242.7" cy="190.8" r="4"/>
  <circle class="blip p3" cx="170.2" cy="182.5" r="4"/>
  <circle class="blip p4" cx="106.9" cy="150.3" r="4"/>
  <circle class="blip p5" cx="165.6" cy="98.9" r="4"/>
  <text x="222" y="60" class="bnum">01</text>
  <text x="243" y="122" class="bnum">02</text>
  <text x="251" y="194" class="bnum">03</text>
  <text x="178" y="192" class="bnum">04</text>
  <text x="86" y="146" class="bnum">05</text>
  <text x="145" y="96" class="bnum">06</text>

  <text x="350" y="48" class="title">CURRENT FOCUS</text>
  <text x="350" y="70" class="subtitle">What I'm going deeper on right now</text>

  <rect class="tag" x="350" y="90" width="348" height="42" rx="10"/>
  <text x="366" y="108" class="idx">01</text>
  <text x="396" y="108" class="tagText">Agent reliability</text>
  <text x="396" y="124" class="sub">critics, grounding, planted-error evals</text>

  <rect class="tag" x="712" y="90" width="348" height="42" rx="10"/>
  <text x="728" y="108" class="idx">02</text>
  <text x="758" y="108" class="tagText">Human-in-the-loop</text>
  <text x="758" y="124" class="sub">approval gates, state patches, audit trails</text>

  <rect class="tag" x="350" y="140" width="348" height="42" rx="10"/>
  <text x="366" y="158" class="idx">03</text>
  <text x="396" y="158" class="tagText">Generative &amp; agentic AI</text>
  <text x="396" y="174" class="sub">going deeper than the API</text>

  <rect class="tag" x="712" y="140" width="348" height="42" rx="10"/>
  <text x="728" y="158" class="idx">04</text>
  <text x="758" y="158" class="tagText">Process automation</text>
  <text x="758" y="174" class="sub">Power Automate · Copilot Studio · M365</text>

  <rect class="tag" x="350" y="190" width="348" height="42" rx="10" style="stroke:#14B8A6"/>
  <text x="366" y="208" class="idx">05</text>
  <text x="396" y="208" class="tagText">Kaivera</text>
  <text x="396" y="224" class="sub">find where AI pays off, build it, run it</text>

  <rect class="tag" x="712" y="190" width="348" height="42" rx="10"/>
  <text x="728" y="208" class="idx">06</text>
  <text x="758" y="208" class="tagText">Honest forecasting</text>
  <text x="758" y="224" class="sub">conformal intervals, rolling backtests</text>
</svg>
